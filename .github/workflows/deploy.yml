
name: Hostinger Automatic Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Website to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Website Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          source: "index.html,style.css"
          target: "/home/u338223569/domains/cicd.southdelhihub.com/public_html/"
          overwrite: true

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            cd /home/u338223569/domains/cicd.southdelhihub.com/public_html

            echo "Checking deployed files..."

            ls -lah index.html style.css

            test -f index.html && echo "HTML file uploaded successfully!"
            test -f style.css && echo "CSS file uploaded successfully!"

            echo "Deployment verification completed!"
