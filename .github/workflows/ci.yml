
name: Complete CI CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# JOB 1: CONTINUOUS INTEGRATION
jobs:
  test:
    name: Test Website Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check HTML File
        run: |
          test -f index.html
          echo "HTML file exists!"

      - name: Check CSS File
        run: |
          test -f style.css
          echo "CSS file exists!"

      - name: Validate HTML Structure
        run: |
          grep -Fqi '<!DOCTYPE html>' index.html
          grep -Fqi '<html' index.html
          grep -Fqi '</html>' index.html
          echo "HTML structure check passed!"

      - name: CI Completed
        run: echo "All tests passed successfully!"

  # JOB 2: CONTINUOUS DEPLOYMENT
  deploy:
    name: Deploy to Hostinger
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # STEP 1: CREATE AUTOMATIC BACKUP
      - name: Create Server Backup
        id: backup
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            set -e

            SITE_DIR="/home/u338223569/domains/cicd.southdelhihub.com/public_html"

            BACKUP_DIR="/home/u338223569/deployment-backups/cicd/${{ github.run_id }}-${{ github.run_attempt }}"

            mkdir -p "$BACKUP_DIR"

            test -f "$SITE_DIR/index.html"
            test -f "$SITE_DIR/style.css"

            cp -p "$SITE_DIR/index.html" "$SITE_DIR/style.css" "$BACKUP_DIR/"

            echo "Automatic backup created successfully!"
            echo "Backup location: $BACKUP_DIR"

      # STEP 2: DEPLOY NEW FILES
      - name: Upload Website Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          source: "index.html,style.css"
          target: "/home/u338223569/domains/cicd.southdelhihub.com/public_html/"
          overwrite: true

      # STEP 3: VERIFY DEPLOYMENT
      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            set -e

            cd /home/u338223569/domains/cicd.southdelhihub.com/public_html

            test -f index.html
            test -f style.css

            echo "Deployment verified successfully!"

      # STEP 4: AUTOMATIC ROLLBACK ON FAILURE
      - name: Automatic Rollback
        if: failure() && steps.backup.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            set -e

            SITE_DIR="/home/u338223569/domains/cicd.southdelhihub.com/public_html"

            BACKUP_DIR="/home/u338223569/deployment-backups/cicd/${{ github.run_id }}-${{ github.run_attempt }}"

            test -f "$BACKUP_DIR/index.html"
            test -f "$BACKUP_DIR/style.css"

            cp -p "$BACKUP_DIR/index.html" "$BACKUP_DIR/style.css" "$SITE_DIR/"

            echo "Automatic rollback completed successfully!"
