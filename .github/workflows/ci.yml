
name: My First CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  first-job:
    name: CI Learning Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Repository
        run: echo "Code successfully fetched!"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la

      - name: Success Message
        run: echo "My First CI Pipeline Completed!"
